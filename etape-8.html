<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parc national des Pyrénées</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; } /* la carte occupe toute la fenêtre */

    /* Étape 7 : mise en forme du panneau des couches et de la légende */
    #panneau {
      position: absolute;
      top: 10px;
      right: 10px;
      max-height: calc(100% - 60px);
      overflow: auto;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      font-size: 13px;
      line-height: 1.6;
    }
    #panneau summary {
      cursor: pointer;
      font-weight: bold;
    }
    #panneau .rubrique {
      margin: 8px 0 2px;
      font-weight: bold;
    }
    #panneau label {
      display: block;
    }
    #panneau img {
      vertical-align: middle;
    }
    .symbole-ligne {
      display: inline-block;
      width: 18px;
      vertical-align: middle;
    }
    .vignette {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1px solid #08306b;
      vertical-align: middle;
    }
    .pastille {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid #7f2704;
      vertical-align: middle;
    }
    .sous-liste {
      margin-left: 22px;
    }
  </style>
</head>
<body>
  <!-- Ouvrir par le serveur de TD (python3 serveur.py 5000), jamais d'un double clic : en file://, -->
  <!-- Chromium refuse de démarrer le worker, et tout navigateur de lire les données -->
  <div id="map"></div>

  <!-- Étape 7 : panneau des couches et de la légende -->
  <details id="panneau" open>
    <summary>Couches et légende</summary>

    <p class="rubrique">Fond de carte</p>
    <label><input type="radio" name="fond" value="plan" checked> Plan IGN</label>
    <label><input type="radio" name="fond" value="photos"> Photographies aériennes</label>

    <p class="rubrique">Parc national</p>
    <label><input type="checkbox" value="coeur" checked> <span class="symbole-ligne" style="height: 10px; background: rgba(65, 171, 93, 0.25); border: 1px solid #006d2c;"></span> cœur du parc</label>
    <label><input type="checkbox" value="aire" checked> <span class="symbole-ligne" style="border-top: 2px dashed #41ab5d;"></span> aire d'adhésion</label>
    <label><input type="checkbox" value="secteurs" checked> <span class="symbole-ligne" style="border-top: 1px solid #525252;"></span> secteurs</label>
    <label><input type="checkbox" value="sentiers" checked> <span class="symbole-ligne" style="border-top: 2px dashed #a50f15;"></span> sentiers</label>
    <label><input type="checkbox" value="maisons" checked> <img src="icones/maison.png" width="16" height="16" alt=""> maisons du parc</label>

    <label><input type="checkbox" value="lacs" checked> lacs (altitude)</label>
    <div class="sous-liste">
      <span class="vignette" style="background: #bdd7e7;"></span> moins de 2100 m<br>
      <span class="vignette" style="background: #6baed6;"></span> de 2100 à 2249 m<br>
      <span class="vignette" style="background: #3182bd;"></span> de 2250 à 2349 m<br>
      <span class="vignette" style="background: #08519c;"></span> 2350 m et plus
    </div>

    <label><input type="checkbox" value="refuges" checked> refuges (type)</label>
    <div class="sous-liste">
      <span class="pastille" style="background: #d94801;"></span> gardé<br>
      <span class="pastille" style="background: #ffffff;"></span> non gardé<br>
      <span class="pastille" style="background: #fdae6b;"></span> chalet
    </div>

    <!-- Étape 8 : filtre des refuges par type -->
    <label class="sous-liste">Afficher :
      <select id="filtre-refuges">
        <option value="tous">tous les refuges</option>
        <option value="gardé">refuges gardés</option>
        <option value="non gardé">refuges non gardés</option>
        <option value="chalet">chalets</option>
      </select>
    </label>

    <p class="rubrique">Forêts</p>
    <label><input type="checkbox" value="foret"> BD Forêt v2</label>
    <a href="https://data.geopf.fr/annexes/ressources/legendes/LANDCOVER.FORESTINVENTORY.V2-legend.png" target="_blank">Légende de la BD Forêt</a>
  </details>

  <script type="module">
    // MapLibre en module, version épinglée : une nouvelle version ne change pas la page
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs";

    // Le code de la carte s'écrit ici, étape par étape. Une ligne ajoutée porte « // Étape N »,
    // une ligne modifiée « // Étape N : modifié ».

    // Étape 1 : création de la carte sur le fond Plan IGN, cadrée sur le parc
    const map = new maplibregl.Map({
      container: "map",
      style: "https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json",
      attributionControl: { customAttribution: "Plan IGN © IGN" },
    });

    // Cadrage sur l'emprise du parc (longitude puis latitude)
    map.fitBounds([[-0.697, 42.673], [0.367, 43.178]], { animate: false });

    // Ajout des boutons de zoom/boussole et de l'échelle
    map.addControl(new maplibregl.NavigationControl(), "top-left");
    map.addControl(new maplibregl.ScaleControl(), "bottom-left");

    // Pour pouvoir inspecter la carte dans la console
    window.map = map;

    // Étape 2 : modification de deux couches du style Plan IGN après chargement
    map.on("load", () => {
      // Bleu plus soutenu pour les surfaces en eau
      map.setPaintProperty("hydro surfacique", "fill-color", "#6baed6");
      // Masquage des forêts fermées du fond (avec la faute d'orthographe « boiséee » du style)
      map.setLayoutProperty("ocs - vegetation - zone boiséee, foret fermee, peupleraie", "visibility", "none");
    });

    // Étape 3 : chargement des six premières couches GeoJSON du parc
    const creditDreal = "Cœur, aire d'adhésion et secteurs : DREAL Nouvelle-Aquitaine";
    const creditPnp = "Sentiers, refuges, maisons du parc : Parc national des Pyrénées";

    async function lireGeojson(fichier) {
      const reponse = await fetch("donnees/" + fichier);
      return await reponse.json();
    }

    map.on("load", async () => {
      // On cherche la plus basse des couches d'écritures (symbol) en haut du style
      const couchesDuStyle = map.getStyle().layers;
      let ecritures;
      for (let i = couchesDuStyle.length - 1; i >= 0; i--) {
        if (couchesDuStyle[i].type !== "symbol") break;
        ecritures = couchesDuStyle[i].id;
      }

      // Cœur du parc
      map.addSource("coeur", {
        type: "geojson",
        generateId: true, // Étape 6 : identifiant auto pour le survol
        data: await lireGeojson("pnp_coeur.geojson"),
        attribution: creditDreal,
      });
      map.addLayer({
        id: "coeur",
        type: "fill",
        source: "coeur",
        paint: {
          "fill-color": "#41ab5d",
          // Étape 6 : modifié - opacité renforcée au survol
          "fill-opacity": [
            "case", ["boolean", ["feature-state", "survol"], false],
            0.45,
            0.25
          ],
          "fill-outline-color": "#006d2c",
        },
      }, ecritures);

      // Secteurs (contour fin seulement, intérieur transparent)
      map.addSource("secteurs", {
        type: "geojson",
        data: await lireGeojson("pnp_secteurs.geojson"),
        attribution: creditDreal,
      });
      map.addLayer({
        id: "secteurs",
        type: "fill",
        source: "secteurs",
        paint: {
          "fill-color": "rgba(0, 0, 0, 0)",
          "fill-outline-color": "#525252",
        },
      }, ecritures);

      // Aire d'adhésion (contour en tiretés)
      map.addSource("aire", {
        type: "geojson",
        data: await lireGeojson("pnp_aire_adhesion.geojson"),
        attribution: creditDreal,
      });
      map.addLayer({
        id: "aire",
        type: "line",
        source: "aire",
        paint: {
          "line-color": "#41ab5d",
          "line-width": 2,
          "line-dasharray": [3, 2],
        },
      }, ecritures);

      // Lacs
      map.addSource("lacs", {
        type: "geojson",
        generateId: true, // Étape 6
        data: await lireGeojson("pnp_lacs.geojson"),
        attribution: "Lacs : IGN, BD TOPO ; altitude : IGN, RGE ALTI",
      });
      map.addLayer({
        id: "lacs",
        type: "fill",
        source: "lacs",
        paint: {
          // Étape 4 : modifié - 4 classes de bleu selon l'altitude
          "fill-color": [
            "step", ["get", "altitude_m"],
            "#bdd7e7",
            2100, "#6baed6",
            2250, "#3182bd",
            2350, "#08519c"
          ],
          // Étape 6 : modifié - lac plus clair au survol
          "fill-opacity": [
            "case", ["boolean", ["feature-state", "survol"], false],
            0.6,
            0.9
          ],
          "fill-outline-color": "#08306b",
        },
      }, ecritures);

      // Sentiers (au-dessus des aplats, mais toujours sous les écritures)
      map.addSource("sentiers", {
        type: "geojson",
        data: await lireGeojson("pnp_sentiers.geojson"),
        attribution: creditPnp,
      });
      map.addLayer({
        id: "sentiers",
        type: "line",
        source: "sentiers",
        paint: {
          "line-color": "#a50f15",
          // Étape 4 : modifié - épaisseur qui grandit avec le zoom
          "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1, 14, 3],
          "line-dasharray": [2.5, 2],
        },
      }, ecritures);

      // Refuges (tout en haut de la pile, au-dessus des écritures)
      map.addSource("refuges", {
        type: "geojson",
        generateId: true, // Étape 6
        data: await lireGeojson("pnp_refuges.geojson"),
        attribution: creditPnp,
      });
      map.addLayer({
        id: "refuges",
        type: "circle",
        source: "refuges",
        paint: {
          // Étape 6 : modifié - cercle agrandi au survol
          "circle-radius": [
            "case", ["boolean", ["feature-state", "survol"], false],
            9,
            6
          ],
          // Étape 4 : modifié - couleur selon le type de refuge
          "circle-color": [
            "match", ["get", "type"],
            "gardé", "#d94801",
            "non gardé", "#ffffff",
            "chalet", "#fdae6b",
            "#808080"
          ],
          "circle-stroke-color": "#7f2704",
          "circle-stroke-width": 2,
        },
      });

      // Étape 4 : ajout des maisons du parc avec leur pictogramme
      const pictogramme = await map.loadImage("icones/maison.png");
      map.addImage("maison", pictogramme.data, { pixelRatio: 2 });
      map.addSource("maisons", {
        type: "geojson",
        generateId: true, // Étape 6
        data: await lireGeojson("pnp_maisons.geojson"),
        attribution: creditPnp,
      });
      map.addLayer({
        id: "maisons",
        type: "symbol",
        source: "maisons",
        layout: {
          "icon-image": "maison",
          "icon-allow-overlap": true,
        },
      });

      // Étape 5 : fenêtre au clic affichant le nom du secteur
      map.on("click", "secteurs", (e) => {
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setText(e.features[0].properties.nom)
          .addTo(map);
      });

      // Étape 6 : info-bulle unique et mise en évidence au survol
      const bulle = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 12,
      });
      let objetSurvole = null;

      function retirerSurvol() {
        if (objetSurvole !== null) {
          map.setFeatureState(objetSurvole, { survol: false });
          objetSurvole = null;
        }
      }

      map.on("mousemove", (e) => {
        retirerSurvol();
        const objets = map.queryRenderedFeatures(e.point, {
          layers: ["maisons", "refuges", "lacs", "coeur"],
        });

        if (objets.length === 0) {
          bulle.remove();
          map.getCanvas().style.cursor = "";
          return;
        }

        const premier = objets[0];
        const props = premier.properties;
        let contenu = "";

        if (premier.layer.id === "coeur") {
          contenu = "<b>" + props.nom + "</b>";
        } else if (premier.layer.id === "lacs") {
          let nomLac = props.nom;
          if (nomLac === undefined) {
            nomLac = "lac sans nom";
          }
          contenu = "Lac : <b>" + nomLac + "</b><br>Altitude : " + props.altitude_m + " m";
        } else if (premier.layer.id === "refuges") {
          contenu = "Refuge : <b>" + props.nom + "</b><br>Type : " + props.type + "<br>Propriétaire : " + props.proprietaire;
        } else {
          contenu = "Maison du parc : <b>" + props.nom + "</b>";
        }

        bulle.setLngLat(e.lngLat).setHTML(contenu).addTo(map);
        map.getCanvas().style.cursor = "pointer";
        objetSurvole = { source: premier.source, id: premier.id };
        map.setFeatureState(objetSurvole, { survol: true });
      });

      map.on("mouseout", () => {
        bulle.remove();
        retirerSurvol();
        map.getCanvas().style.cursor = "";
      });

      // Étape 7 : ajout des photographies aériennes (WMTS) et de la BD Forêt (WMS)
      const urlPhotos = "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0"
        + "&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg"
        + "&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
      map.addSource("photos", {
        type: "raster",
        tiles: [urlPhotos],
        tileSize: 256,
        attribution: "Photographies aériennes © IGN",
      });
      map.addLayer({
        id: "photos",
        type: "raster",
        source: "photos",
        layout: { visibility: "none" },
      }, "coeur");

      const urlForet = "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0"
        + "&REQUEST=GetMap&LAYERS=LANDCOVER.FORESTINVENTORY.V2&STYLES="
        + "&FORMAT=image/png&TRANSPARENT=true"
        + "&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=512&HEIGHT=512";
      map.addSource("foret", {
        type: "raster",
        tiles: [urlForet],
        tileSize: 512,
        attribution: "BD Forêt v2 © IGN",
      });
      map.addLayer({
        id: "foret",
        type: "raster",
        source: "foret",
        layout: { visibility: "none" },
        paint: { "raster-opacity": 0.6 },
      }, "coeur");

      // Étape 7 : gestion des cases à cocher et des boutons radio du panneau
      const cases = document.querySelectorAll("#panneau input[type=checkbox]");
      for (const caseCouche of cases) {
        caseCouche.addEventListener("change", () => {
          let etat = "none";
          if (caseCouche.checked) {
            etat = "visible";
          }
          map.setLayoutProperty(caseCouche.value, "visibility", etat);
        });
      }

      const radios = document.querySelectorAll("#panneau input[name=fond]");
      for (const radio of radios) {
        radio.addEventListener("change", () => {
          let etat = "none";
          if (radio.value === "photos") {
            etat = "visible";
          }
          map.setLayoutProperty("photos", "visibility", etat);
        });
      }

      // Étape 8 : filtrage des refuges selon le type choisi dans la liste
      const listeRefuges = document.getElementById("filtre-refuges");
      listeRefuges.addEventListener("change", (e) => {
        const choix = e.target.value;
        if (choix === "tous") {
          map.setFilter("refuges", null);
        } else {
          map.setFilter("refuges", ["==", ["get", "type"], choix]);
        }
      });
    });
  </script>
</body>
</html>
